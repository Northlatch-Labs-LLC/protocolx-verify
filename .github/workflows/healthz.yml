# Co-authored-by: Kaela <kaela@projectxprotocol.dev>
#
# The door watch. If the front door dies at 3am, something must say so — this is
# the something. Every six hours (off the hour, deliberately: scheduled jobs pile
# up on the hour and get delayed), a clean machine knocks on /healthz and demands
# "ok": true. A failed run is a red workflow and a notification to the org — alerting
# with no third-party service and no additional dependency.

name: Door watch

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthz:
    name: The door answers, fully configured
    runs-on: ubuntu-latest
    steps:
      - name: Knock
        env:
          HEALTHZ_URL: ${{ vars.WORKER_HEALTHZ_URL }}
        run: |
          # The host lives in a repository variable, not in this file. This repository is on a
          # publication path, and a workers.dev subdomain is derived from the account holder's
          # own identifier — the same reason REGISTRATION.md keeps CF_ACCOUNT_ID a placeholder.
          # Fail loudly rather than silently skipping if the variable is unset: a health check
          # that quietly passes when it checked nothing is worse than no health check.
          [ -n "${HEALTHZ_URL:-}" ] || { echo "WORKER_HEALTHZ_URL is not set on this repository"; exit 1; }
          BODY=$(curl -sS --max-time 15 "$HEALTHZ_URL") || {
            echo "THE FRONT DOOR DID NOT ANSWER AT ALL"; exit 1; }
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || {
            echo "THE FRONT DOOR ANSWERED BUT IS NOT HEALTHY — see missing[] above"; exit 1; }
