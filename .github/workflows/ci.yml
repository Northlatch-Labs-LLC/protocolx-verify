# Built-by: @projectx.sui /|\
# Co-authored-by: Kaela <kaela@projectxprotocol.dev>
#
# The tool that measures gates runs its own gates on itself. Every pull request here proves,
# on a machine that has never seen this repository: the crypto and routing logic
# passes its tests against an independent implementation, every shell script parses,
# every JS entrypoint parses, and the engine copies are still byte-identical to the
# recorded hashes — a drifted engine copy is a different product wearing our name.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Self-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests (crypto, routing, engine-output parsing)
        run: node --test worker/test/lib.test.mjs

      - name: Usage ledger (metering, absence, and the closed door)
        # The measurement an invoice is written from. These prove, against a real
        # webhook delivery captured from our own App: an install creates a record, an
        # uninstall ends it without destroying history, a repository-selection change
        # is captured, an unrecorded count reads as null-with-a-reason and never as 0,
        # and /usage serves nobody when its secret is unset.
        run: node --test worker/test/ledger.test.mjs

      - name: Evidence store and cross-language digest
        # The bundle's digest is computed in Python and re-computed in JavaScript. If
        # the two ever disagree the content-addressed store rejects real bundles, so
        # these hash manifests the Python writer actually produced — including ones
        # stuffed with the characters most likely to split the two implementations.
        # Also proves the permalink stays inert and that it cannot shadow /usage.
        run: node --test worker/test/evidence-store.test.mjs

      - name: Preflight — the values a stranger's repository gets to choose
        # The package path and the dispatch inputs reach a shell; the client's Move.toml
        # reaches git. These prove every one of them is checked against an allowlist
        # before it does, including the git transports that are remote code execution.
        run: node --test runner/test/preflight.test.mjs

      - name: Secret distance — the step that runs client code holds no credential
        # Two halves. Runtime: poison a shell with every secret the runner really holds,
        # send a command through runner/sandbox.sh, and read back what the child actually
        # got. Static: read verify-run.yml and prove the workflow puts client code behind
        # that wrapper with nothing credentialed in scope. The first proves the wrapper
        # works, the second proves it is used — and the second is the one a future edit
        # breaks.
        run: bash runner/test/secret-distance.sh

      - name: Mutation engine unit tests
        run: python3 engine/move-mutate/test/test_movemutate.py

      - name: The action's closure does not reach into the worker
        # The defect this guards cost a full hosted-runner e2e to find:
        # action/summary.mjs imported the gate parser from worker/src/lib.js, so in a
        # tree that ships without the worker the LAST step of every run died with
        # ERR_MODULE_NOT_FOUND — after installing the toolchain, sandboxing the
        # client's code and measuring all five gates. The parser now exists twice;
        # this proves the copies agree and that no runtime file reaches outside the
        # shipped closure again.
        run: node --test runner/test/gates-output-mirror.test.mjs

      - name: The tamper tripwire trips in a tree with no worker/
        # A security control, not a path check. The tripwire used to be three copies of
        # `find runner worker engine action` inside action.yml, and `find` EXITS
        # NON-ZERO on a directory that does not exist — so in any tree shipped without
        # one of them it errored instead of tripping, under `set -e`, and an errored
        # tripwire is an absent one. This builds a worker-less tree, arms it, edits a
        # file under engine/ and asserts the run is refused with `PVS sandbox breach`.
        run: bash runner/test/tripwire.test.sh

      - name: Runner wiring (measurement must not depend on reporting)
        # Structural, on purpose. The gates were once conditioned on a step whose only
        # job was to colour five check runs yellow, so an API hiccup skipped the whole
        # measurement. Nothing in the repository would have caught that regression.
        run: node --test runner/test/wiring.test.mjs

      - name: Evidence bundle unit tests
        # The bundle is the document an auditor is handed. These prove its
        # numbers are the engine's numbers, that its digest reproduces across runs and
        # moves when a result moves, and that a gate which never ran serialises as
        # null with a reason rather than as a zero.
        run: python3 engine/test/test_evidence_bundle.py

      - name: Outcome classifier is not pipe-dependent
        # Guards a regression that inverted a real client result: classifying
        # killed-vs-did-not-compile through `echo | grep -q` under pipefail reports
        # 141 on SIGPIPE even when the pattern matched, turning every kill into a
        # compile failure — but only once the output is large enough to race.
        run: bash engine/test/classify.sh

      - name: The shipped engine is the engine it claims to be
        # The defect this guards, found 2026-08-30: the shipped engine was missing
        # lib/shadow.py entirely and its loader never named it, hours after a sync
        # from canonical. The App therefore ran a measurably different engine from
        # the one run in-house, and neither copy was authoritative. That is
        # exactly what our own digest gate defends against — the thing that runs is not
        # the thing in the repository. Checks provenance, per-file hashes, and that
        # the module loader agrees with the modules actually shipped.
        run: bash engine/test/engine-drift.sh

      - name: A digest that cannot be read is not a digest that disagreed
        # The defect this guards, observed on weir PR #88: the digest gate published
        # `fail` — which this product defines as the source no longer building to the
        # deployed package — for a pull request that changed no Move source at all.
        # The build had produced an empty dump, `json.load` raised inside a pipeline,
        # and a failed READ was reported as a failed MEASUREMENT. The next push, on
        # byte-identical source, passed.
        #
        # A gate that is flaky is worse than a gate that is absent: an absent gate is
        # known to be absent, and a flaky one teaches the reader to push again and
        # watch it go green. That is the opposite of what this product is for.
        run: bash engine/test/digest-reader.sh

      - name: A digest verdict does not accuse the source when the compiler moved
        run: bash engine/test/toolchain-note.sh

      - name: The shipped engine measures a nested package
        # The defect this guards: a flat `sources/*.move` glob derives ZERO mutations
        # from any package that nests its modules, so our own product reports
        # "nothing to mutate" on a real client repository. Runs the SHIPPED engine
        # copy, not the tool it was copied from.
        run: bash engine/test/app-path.sh

      - name: Every shell script parses
        run: |
          for f in scripts/*.sh engine/ci/*.sh engine/move-mutate/*.sh engine/test/*.sh \
                   runner/*.sh runner/test/*.sh; do
            bash -n "$f"
            echo "$f: OK"
          done

      - name: Every JS entrypoint parses
        run: |
          node --check worker/src/index.js
          node --check worker/src/lib.js
          node --check worker/src/ledger.js
          node --check worker/test/ledger.test.mjs
          node --check runner/mint-token.mjs
          node --check runner/report-gates.mjs
          node --check runner/preflight.mjs
          node --check runner/lib/preflight.mjs
          node --check runner/test/wiring.test.mjs
          node --check worker/test/evidence-store.test.mjs

          node --check runner/test/preflight.test.mjs
          node --check action/resolve-package.mjs
          node --check action/summary.mjs
          node --check action/gates-output.mjs
          node --check runner/test/gates-output-mirror.test.mjs

      - name: Every module the worker imports is actually deployed
        # scripts/deploy.sh uploads an explicit module list to the Cloudflare API. A new
        # module in worker/src that nobody adds to that list resolves fine in tests and
        # 500s on the first real delivery, in production, at the front door. This is the
        # tripwire.
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("worker/src/index.js", "utf8");
            const deploy = fs.readFileSync("scripts/deploy.sh", "utf8");
            const imported = [...src.matchAll(/from\s+["\x27]\.\/([A-Za-z0-9_.-]+)["\x27]/g)].map((m) => m[1]);
            let bad = 0;
            for (const f of new Set(["index.js", ...imported])) {
              if (deploy.includes(f + "=@$HERE/worker/src/" + f)) {
                console.log("deploy.sh uploads " + f + ": OK");
              } else {
                console.error("deploy.sh does NOT upload worker/src/" + f + " — the deployed worker could not resolve it");
                bad = 1;
              }
            }
            process.exit(bad);
          '

      - name: Engine copies match their recorded hashes
        run: sha256sum -c engine/CHECKSUMS

      - name: Every Python entrypoint parses
        run: python3 -m py_compile runner/test/workflow-audit.py engine/move-mutate/lib/*.py

      - name: Manifest and workflow files are valid
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("app/app-manifest.json", "utf8")); console.log("manifest: valid JSON")'
          node -e 'const fs = require("fs"); for (const f of fs.readdirSync(".github/workflows")) fs.readFileSync(".github/workflows/" + f, "utf8"); console.log("workflows: readable")'
