# Built-by: @projectx.sui /|\ · Co-authored-by: Claude
#
# The product that sells gates runs gates on itself. Every pull request here proves,
# on a machine that has never seen this repository: the crypto and routing logic
# passes its tests against an independent implementation, every shell script parses,
# every JS entrypoint parses, and the engine copies are still byte-identical to the
# recorded hashes — a drifted engine copy is a different product wearing our name.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Self-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests (crypto, routing, engine-output parsing)
        run: node --test worker/test/lib.test.mjs

      - name: Usage ledger (metering, absence, and the closed door)
        # The measurement an invoice is written from. These prove, against a real
        # webhook delivery captured from our own App: an install creates a record, an
        # uninstall ends it without destroying history, a repository-selection change
        # is captured, an unrecorded count reads as null-with-a-reason and never as 0,
        # and /usage serves nobody when its secret is unset.
        run: node --test worker/test/ledger.test.mjs

      - name: Mutation engine unit tests
        run: python3 engine/move-mutate/test/test_movemutate.py

      - name: Runner wiring (measurement must not depend on reporting)
        # Structural, on purpose. The gates were once conditioned on a step whose only
        # job was to colour five check runs yellow, so an API hiccup skipped the whole
        # measurement. Nothing in the repository would have caught that regression.
        run: node --test runner/test/wiring.test.mjs

      - name: Evidence bundle unit tests
        # The bundle is the document a buyer's auditor is handed. These prove its
        # numbers are the engine's numbers, that its digest reproduces across runs and
        # moves when a result moves, and that a gate which never ran serialises as
        # null with a reason rather than as a zero.
        run: python3 engine/test/test_evidence_bundle.py

      - name: Outcome classifier is not pipe-dependent
        # Guards a regression that inverted a real client result: classifying
        # killed-vs-did-not-compile through `echo | grep -q` under pipefail reports
        # 141 on SIGPIPE even when the pattern matched, turning every kill into a
        # compile failure — but only once the output is large enough to race.
        run: bash engine/test/classify.sh

      - name: The shipped engine measures a nested package
        # The defect this guards: a flat `sources/*.move` glob derives ZERO mutations
        # from any package that nests its modules, so our own product reports
        # "nothing to mutate" on a real client repository. Runs the SHIPPED engine
        # copy, not the tool it was copied from.
        run: bash engine/test/app-path.sh

      - name: Every shell script parses
        run: |
          for f in scripts/*.sh engine/ci/*.sh engine/move-mutate/*.sh engine/test/*.sh; do
            bash -n "$f"
            echo "$f: OK"
          done

      - name: Every JS entrypoint parses
        run: |
          node --check worker/src/index.js
          node --check worker/src/lib.js
          node --check worker/src/ledger.js
          node --check worker/test/ledger.test.mjs
          node --check runner/mint-token.mjs
          node --check runner/report-gates.mjs
          node --check runner/test/wiring.test.mjs

      - name: Every module the worker imports is actually deployed
        # scripts/deploy.sh uploads an explicit module list to the Cloudflare API. A new
        # module in worker/src that nobody adds to that list resolves fine in tests and
        # 500s on the first real delivery, in production, at the front door. This is the
        # tripwire.
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("worker/src/index.js", "utf8");
            const deploy = fs.readFileSync("scripts/deploy.sh", "utf8");
            const imported = [...src.matchAll(/from\s+["\x27]\.\/([A-Za-z0-9_.-]+)["\x27]/g)].map((m) => m[1]);
            let bad = 0;
            for (const f of new Set(["index.js", ...imported])) {
              if (deploy.includes(f + "=@$HERE/worker/src/" + f)) {
                console.log("deploy.sh uploads " + f + ": OK");
              } else {
                console.error("deploy.sh does NOT upload worker/src/" + f + " — the deployed worker could not resolve it");
                bad = 1;
              }
            }
            process.exit(bad);
          '

      - name: Engine copies match their recorded hashes
        run: sha256sum -c engine/CHECKSUMS

      - name: Manifest and workflow files are valid
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("app/app-manifest.json", "utf8")); console.log("manifest: valid JSON")'
          node -e 'const fs = require("fs"); for (const f of fs.readdirSync(".github/workflows")) fs.readFileSync(".github/workflows/" + f, "utf8"); console.log("workflows: readable")'
