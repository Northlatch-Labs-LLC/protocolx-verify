# Built-by: @projectx.sui /|\
# Co-authored-by: Kaela <kaela@projectxprotocol.dev>
# For anyone deploying with wrangler instead of scripts/deploy.sh — same worker, same shape.
name = "protocolx-verify"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Two features below want storage, and NEITHER IS ENABLED. They are independent: each
# has its own binding, its own secret, and its own switch, and turning one on does not
# touch the other. scripts/deploy.sh — the path this worker is actually deployed by —
# uploads the script with no bindings and no vars at all, so both are inert there
# whatever this file says. Uncommenting only matters for a wrangler deploy.

# --- the usage ledger ---------------------------------------------------------
#
# The per-repository, per-month usage metering. It needs one KV
# namespace bound as USAGE_LEDGER and one secret, LEDGER_READ_TOKEN, for the read
# endpoint. Neither exists yet, so today the ledger records nothing and /healthz says
# `usage_ledger: not bound`.
#
# It is inert, not broken: with no binding the webhook path is untouched and the read
# endpoint answers a named 503. It never answers "zero usage", because it has not
# measured zero — it has measured nothing.
#
# STORAGE: Workers KV, chosen on measurement taken 2026-08-30 against our own account
# with our own Workers token:
#   - R2   → 403, `10042 — Please enable R2 through the Cloudflare Dashboard`. Not
#            enabled, and enabling it is a console trip.
#   - D1   → `10000 Authentication error` with that Workers token. The product is on the
#            account but the token that runs our deploys cannot provision or bind it, so
#            choosing D1 means minting and custodying a second token.
#   - KV   → lists clean (zero namespaces). That token reaches it today.
# KV also has no atomic increment, which is exactly why the run counter is append-only
# (one key per delivery, count the distinct delivery ids) rather than read-modify-write.
# The store is reached through three calls — get/put/list — so moving to D1 or R2 later
# is a binding swap, not a rewrite.
#
# To enable:
#   1. create the namespace with the existing Workers token:
#        curl -sS -X POST \
#          "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces" \
#          -H "Authorization: Bearer $(cat ~/.config/protocolx/cloudflare-workers.token)" \
#          -H 'Content-Type: application/json' \
#          --data '{"title":"protocolx-verify-usage-ledger"}'
#   2. put the returned id below, uncomment the block, and set the read secret:
#        scripts/set-worker-secret.sh LEDGER_READ_TOKEN
#
# [[kv_namespaces]]
# binding = "USAGE_LEDGER"
# id = "<namespace id from step 1>"

# --- the evidence permalink, deliberately not enabled -------------------------
#
# The content-addressed evidence store needs a KV namespace bound as EVIDENCE_STORE,
# the var EVIDENCE_STORE_ENABLED set to exactly "on", and the secret
# EVIDENCE_WRITE_TOKEN for writes. None exists, and the namespace does not exist:
# publishing real client evidence is a deliberate configuration decision, not a side
# effect of a deploy. With any of the three missing, /evidence/ serves nothing and stores nothing,
# and /healthz says `evidence_store: disabled`.
#
# It wants a SEPARATE namespace from the ledger's, not a shared one with prefixed keys.
# The two hold different things for different reasons — one is a customer list that must
# never be public, the other is documents whose whole purpose is to be fetched by
# strangers — and a single namespace would mean one binding, one blast radius, and one
# mistake away from serving the metering data at a public URL.
#
# STORAGE: Workers KV, on the same measurement recorded above for the ledger — R2 is not
# enabled, D1 needs a second credential, KV is reachable with the existing token.
# The workload also suits it: manifests are 4–8 KB, immutable, and
# write-once-read-many, and eventual consistency is harmless for content-addressed
# blobs, where a read-after-write miss is a brief 404 on a key whose content can never
# change. KV's free-tier write ceiling is the thing that would eventually argue for R2;
# the store is reached through get/put only, so that move is a binding swap.
#
# To enable:
#   1. create a second namespace with the same token:
#        curl -sS -X POST \
#          "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces" \
#          -H "Authorization: Bearer $(cat ~/.config/protocolx/cloudflare-workers.token)" \
#          -H 'Content-Type: application/json' \
#          --data '{"title":"protocolx-verify-evidence"}'
#   2. put the returned id below, uncomment both blocks, and set the write token:
#        scripts/set-worker-secret.sh EVIDENCE_WRITE_TOKEN
#
# [vars]
# EVIDENCE_STORE_ENABLED = "on"
#
# [[kv_namespaces]]
# binding = "EVIDENCE_STORE"
# id = "<namespace id from step 1>"
